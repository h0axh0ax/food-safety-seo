name: Full FDA Backfill

# Occasional full history refresh so older status changes are not missed
# by the 45-day incremental sync.
on:
  schedule:
    # Every Sunday 08:00 UTC (16:00 UTC+8)
    - cron: "0 8 * * 0"
  workflow_dispatch:

jobs:
  full-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Full openFDA fetch and sync to Supabase
        run: python scripts/run_full_sync.py
        env:
          OPENFDA_API_KEY: ${{ secrets.OPENFDA_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

      - name: Data quality checks
        run: python scripts/check_data_quality.py --sample-size 40
        env:
          OPENFDA_API_KEY: ${{ secrets.OPENFDA_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
