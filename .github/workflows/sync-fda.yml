name: Sync FDA Recalls

# openFDA has no webhook — poll every 6 hours and upsert changes into Supabase.
on:
  schedule:
    # Every 6 hours: 00:00 / 06:00 / 12:00 / 18:00 UTC
    # (08:00 / 14:00 / 20:00 / 02:00 UTC+8)
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch openFDA and sync to Supabase
        run: python scripts/run_sync.py
        env:
          OPENFDA_API_KEY: ${{ secrets.OPENFDA_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

      - name: Data quality checks
        run: python scripts/check_data_quality.py --sample-size 20
        env:
          OPENFDA_API_KEY: ${{ secrets.OPENFDA_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
